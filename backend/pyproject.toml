[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marketmind-backend"
version = "0.1.0"
description = "MarketMind AI backend API"
requires-python = ">=3.11"
dependencies = [
  "alembic==1.16.4",
  "argon2-cffi==25.1.0",
  "email-validator==2.2.0",
  "fastapi==0.116.1",
  "numpy>=1.26.0",
  "pandas>=2.1.0",
  "psycopg2-binary>=2.9.9",
  "psycopg[binary]==3.2.9",
  "pydantic-settings==2.10.1",
  "PyJWT==2.10.1",
  "pyotp==2.9.0",
  "python-multipart==0.0.20",
  "scikit-learn>=1.3.0",
  "scipy>=1.11.0",
  "sqlalchemy==2.0.41",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pytest==8.4.1",
  "pytest-cov==6.2.1",
  "ruff==0.12.5",
]

[project.scripts]
marketmind-import = "app.commands.import_data:main"
marketmind-import-segments = "app.commands.import_segments:main"
marketmind-import-forecasts = "app.commands.import_forecasts:main"
marketmind-seed-demo = "app.commands.seed_demo:main"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
